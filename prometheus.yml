global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'calassist'
    environment: 'production'

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: 'calassist-api'
    metrics_path: '/metrics'
    dns_sd_configs:
      - names: ['api']
        type: A
        port: 3000

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
